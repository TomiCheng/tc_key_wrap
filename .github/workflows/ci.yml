name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: Native / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-latest
            host: x86_64-unknown-linux-gnu
          - name: Linux ARM64
            os: ubuntu-24.04-arm
            host: aarch64-unknown-linux-gnu
          - name: macOS ARM64
            os: macos-14
            host: aarch64-apple-darwin
          - name: Windows x64
            os: windows-latest
            host: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Install native toolchain
        run: |
          rustup toolchain install stable-${{ matrix.host }} --profile minimal
          rustup default stable-${{ matrix.host }}
          rustc -vV
          rustc -vV | grep -Fx 'host: ${{ matrix.host }}'
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo test --locked
      - run: cargo test --locked --all-features

  x86:
    name: Native execution / Linux i686
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install 32-bit compiler and runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-multilib
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: rustup target add i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --target i686-unknown-linux-gnu
      - run: cargo test --locked --target i686-unknown-linux-gnu --all-features

  msrv:
    name: MSRV / Rust 1.85.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.85.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        env:
          RUSTUP_TOOLCHAIN: 1.85.0
      # Rust 1.85 covers the libraries with every first-party feature. The
      # rfc3211 feature and tc_rc2_wrap follow rand_core's MSRV and
      # dev-dependencies are exempt, so tests run on stable only.
      - run: cargo +1.85.0 check --locked
      - run: cargo +1.85.0 check --locked -p tc_key_wrap --features rfc5649,alloc

  quality:
    name: Format, Clippy, docs and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: rustup default stable
      - run: cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@v2
        with:
          key: build-only
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      # Each algorithm must build on its own, not only next to the others.
      - name: Clippy each tc_key_wrap feature alone
        run: |
          for feature in rfc3394 rfc5649 rfc3211 alloc; do
            cargo clippy --locked -p tc_key_wrap --all-targets --features "$feature" -- -D warnings
          done
      - run: cargo doc --locked --no-deps
      - run: cargo doc --locked --no-deps --all-features
      # Packaged together so the wrappers are verified against this
      # tc_key_wrap; the wrappers not prepared for release yet join as they
      # are.
      - run: cargo package --locked -p tc_key_wrap -p tc_rc2_wrap
        env:
          # Keep unpacked package manifests outside rust-cache's build tree.
          CARGO_TARGET_DIR: ${{ runner.temp }}/package

  portable:
    name: Cross-architecture contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal
      - run: rustup default stable
      - run: rustup target add wasm32-unknown-unknown aarch64-unknown-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --target wasm32-unknown-unknown
      - run: cargo check --locked --target wasm32-unknown-unknown --all-features
      - run: cargo check --locked --target aarch64-unknown-none
      - run: cargo check --locked --target aarch64-unknown-none --all-features
      - name: Check dependency sets
        run: |
          check() {
            expected="$1"; shift
            actual="$(cargo tree --locked --edges normal --prefix none "$@" | cut -d' ' -f1 | sort -u | paste -sd' ')"
            if [ "$actual" != "$expected" ]; then
              echo "cargo tree $*: expected '$expected', got '$actual'" >&2
              exit 1
            fi
          }
          # No crate here has a platform-specific dependency, so every target
          # shares the same sets.
          for target in aarch64-unknown-none wasm32-unknown-unknown x86_64-unknown-linux-gnu i686-unknown-linux-gnu; do
            check 'tc_block_cipher tc_key_wrap tc_zeroize' -p tc_key_wrap --target "$target"
            check 'tc_block_cipher tc_key_wrap tc_zeroize' -p tc_key_wrap --target "$target" --features alloc
            check 'tc_block_cipher tc_constant_time tc_key_wrap tc_zeroize' -p tc_key_wrap --target "$target" --features rfc3394
            check 'tc_block_cipher tc_constant_time tc_key_wrap tc_zeroize' -p tc_key_wrap --target "$target" --features rfc5649
            check 'rand_core tc_block_cipher tc_key_wrap tc_zeroize' -p tc_key_wrap --target "$target" --features rfc3211
            check 'rand_core tc_block_cipher tc_constant_time tc_digest tc_key_wrap tc_rc2_wrap tc_rc_cipher tc_sha tc_zeroize' -p tc_rc2_wrap --target "$target"
          done
