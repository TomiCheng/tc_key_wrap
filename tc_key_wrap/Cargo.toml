[package]
name = "tc_key_wrap"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "RFC 3394, RFC 5649 and RFC 3211 key wrapping over block ciphers, with shared key-wrap traits."
readme = "README.md"
documentation = "https://docs.rs/tc_key_wrap"
keywords = ["key-wrap", "rfc3394", "rfc5649", "cryptography", "no-std"]
categories = ["cryptography", "no-std"]
include = ["src/**", "tests/**", "README.md", "CHANGELOG.md", "LICENSE-MIT", "LICENSE-APACHE"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
alloc = ["tc_zeroize/alloc"]
rfc3211 = ["tc_zeroize/alloc", "dep:rand_core", "alloc"]
rfc3394 = ["dep:tc_constant_time"]
rfc5649 = ["rfc3394"]

[dependencies]
rand_core = { version = "0.10.1", optional = true }
tc_block_cipher = "0.1.0"
tc_constant_time = { version = "0.1.0", optional = true }
tc_zeroize = "0.1.0"

[dev-dependencies]
rand = { workspace = true }
tc_aes = "0.1.0"
tc_aria = "0.1.0"
tc_des = "0.1.0"
